name: Actualizar cuadro EPEC

on:
  schedule:
    # Días 3 y 18, 09:00 en Argentina: EPEC publica el cuadro del 1 un par de días después
    # y a veces saca cuadros a mitad de mes. Se puede correr a mano con "Run workflow".
    - cron: "0 12 3,18 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Volver a procesar el último cuadro aunque no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Buscar y procesar el cuadro
        run: python -m scraper.main ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tariffs.json history
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Cuadro EPEC $(python -c 'import json;print(json.load(open("tariffs.json"))["sources"][0]["schedule"]["validFrom"])')"
            git push
          fi
